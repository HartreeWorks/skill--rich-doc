<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Inter, 'Helvetica Neue', Helvetica, sans-serif">
  <!--
    Diagram template for rich docs. Copy, then replace the example boxes.

    Palettes (swap the hex values; keep the roles):
      role          neutral
      background    #fafaf8
      ink           #24221f
      muted text    #6b6762
      box border    #c4c1bb
      accent        #3c6f8b
      accent soft   #eaf2f6
      gap fill      #f6d6cf
      gap ink       #7a2418

    Box kinds (one meaning each; say what they mean in the caption):
      plain    exists           white fill, border
      key      the main step    white fill, ink border 1.5
      future   doesn't exist    accent-soft fill, accent dashed border
      gap      broken/missing   gap fill, gap-ink border and text
      result   the question     ink fill, background-colour text

    Text: 13px 600 for box titles, 12px for detail, 11px+ uppercase for group labels.
    Leave 14px inside boxes; keep labels off the paths of curves.
    Render: python3 -I <skill>/scripts/visual.py svg <file>.svg
  -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#24221f"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3c6f8b"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafaf8"/>
  <text x="20" y="26" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6b6762">GROUP LABEL</text>

  <!-- plain -->
  <rect x="20" y="44" width="170" height="50" rx="6" fill="#ffffff" stroke="#c4c1bb"/>
  <text x="34" y="66" font-size="13" font-weight="600" fill="#24221f">Plain box</text>
  <text x="34" y="84" font-size="12" fill="#6b6762">exists today</text>
  <path d="M190 69 L248 69" stroke="#24221f" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- key -->
  <rect x="250" y="40" width="190" height="58" rx="6" fill="#ffffff" stroke="#24221f" stroke-width="1.5"/>
  <text x="264" y="64" font-size="13" font-weight="600" fill="#24221f">Key step</text>
  <text x="264" y="84" font-size="12" fill="#6b6762">the main thing</text>

  <!-- gap -->
  <path d="M345 98 L345 168" stroke="#3c6f8b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#o)"/>
  <rect x="250" y="170" width="190" height="58" rx="6" fill="#f6d6cf" stroke="#7a2418"/>
  <text x="264" y="194" font-size="13" font-weight="600" fill="#7a2418">Gap</text>
  <text x="264" y="214" font-size="12" fill="#7a2418">what's broken or missing</text>

  <!-- future -->
  <rect x="490" y="170" width="180" height="58" rx="6" fill="#eaf2f6" stroke="#3c6f8b" stroke-dasharray="5 4"/>
  <text x="504" y="194" font-size="13" font-weight="600" fill="#24221f">Future</text>
  <text x="504" y="214" font-size="12" fill="#6b6762">doesn't exist yet</text>
  <path d="M670 199 L708 199" stroke="#3c6f8b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#o)"/>

  <!-- result -->
  <rect x="710" y="170" width="170" height="58" rx="6" fill="#24221f"/>
  <text x="724" y="194" font-size="13" font-weight="600" fill="#fafaf8">Result</text>
  <text x="724" y="214" font-size="12" fill="#e8e6e1">the question it answers</text>
</svg>
